[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotmach-project"
version = "0.1.0"
description = "Reproducible causal vibration prediction study for MECG 7780"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "torch", "matplotlib", "python-pptx", "PyYAML", "nbformat", "nbclient", "ipykernel", "pytest", "reportlab", "tabulate"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
